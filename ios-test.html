<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>iOS test</title>
<style>body{font:20px system-ui;padding:16px}button,a{display:block;width:100%;margin:12px 0;padding:14px;font:inherit;text-align:center;border:1px solid #888;border-radius:10px;color:inherit;background:#eee;text-decoration:none}</style>
<a href="sample.ics">D: link file .ics thật</a>
<button id="a">A: location = blob</button>
<button id="b">B: window.open blob</button>
<button id="c">C: navigator.share file</button>
<p id="out"></p>
<script>
let ics; fetch('sample.ics').then(r => r.text()).then(t => ics = t);
const blob = () => URL.createObjectURL(new Blob([ics], { type: 'text/calendar' }));
const out = (s) => document.getElementById('out').textContent = s;
a.onclick = () => { location.href = blob(); out('A ran'); };
b.onclick = () => { const w = window.open(blob()); out('B ran, window=' + !!w); };
c.onclick = async () => {
  const f = new File([ics], 'lich-am.ics', { type: 'text/calendar' });
  out('C canShare=' + (navigator.canShare && navigator.canShare({ files: [f] })));
  try { await navigator.share({ files: [f] }); } catch (e) { out('C error: ' + e.name + ' ' + e.message); }
};
</script>
