# Push lên main thì deploy index.html + pkg/ lên Cloudflare Pages (damgio.pages.dev).
# Cần 2 secret của repo: CLOUDFLARE_API_TOKEN (chỉ quyền Cloudflare Pages: Edit) và CLOUDFLARE_ACCOUNT_ID.
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        # Chỉ đưa trang và wasm lên, không đưa code Rust hay file test.
        run: mkdir dist && cp index.html dist/ && cp -R pkg dist/
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@4.50.0 pages deploy dist --project-name damgio --branch main --commit-dirty=true
